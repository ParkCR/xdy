<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片查看器3.0</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('http://3650000.xyz/api/?mode=1,3,5,8');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            flex-direction: column;
        }

        .time-display {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 65px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 2;
            transition: font-size 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        top 0.5s cubic-bezier(0.4, 0, 0.2, 1); /* 使用更平滑的过渡曲线 */
        }

        .container {
            width: 90%;
            max-width: 800px;
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(7px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            margin: 20px;
            position: relative;
            z-index: 1;
            transition: max-height 0.5s ease, height 0.5s ease;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .mode-tabs {
            display: flex;
            justify-content: center; /* 标签居中 */
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .mode-tab {
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .mode-tab.active {
            border-bottom: 2px solid #007bff;
            color: #007bff;
        }

        .clearfix {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        input[type="text"], textarea {
            width: calc(100% - 160px);
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 30px;
            transition: border-color 0.3s ease;
            background-color: #fff;
            color: #333;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
            border-radius: 20px;
            resize: vertical;
            font-family: inherit;
            line-height: 1.5;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        #openButton, #batchProcessButton, #copyAllButton {
            padding: 15px 30px;
            cursor: pointer;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 30px;
            transition: background-color 0.3s ease;
            box-sizing: border-box;
            height: auto;
            align-self: center;
        }

        #openButton:hover, #batchProcessButton:hover, #copyAllButton:hover {
            background-color: #0056b3;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        .options {
            margin-top: 30px;
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            justify-content: center; /* 分类居中 */
        }

        .category-tab {
            padding: 5px 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .category-tab:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .category-tab.active {
            background-color: #007bff;
            color: white;
        }

        label {
            display: block;
            margin-bottom: 15px;
            cursor: pointer;
            color: #fff;
        }

        input[type="radio"] {
            margin-right: 5px;
        }

        .service-group {
            margin-bottom: 25px;
        }

        .service-group h3 {
            margin-bottom: 10px;
            font-size: 18px;
            color: #e0e0e0;
            padding-left: 5px;
            border-left: 3px solid #007bff;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
        }

        .option-group label {
            width: 33.33%;
            margin-bottom: 10px;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .scrollable-container {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 20px;
            padding-right: 10px;
        }

        .scrollable-container::-webkit-scrollbar {
            width: 6px;
        }

        .scrollable-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .scrollable-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .batch-results {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            transition: max-height 0.3s ease, opacity 0.3s ease;
        }

        .batch-results.active {
            display: block;
        }

        .batch-results h4 {
            margin-top: 0;
            color: #007bff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        .result-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-original {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .result-converted {
            word-break: break-all;
        }

        .result-link {
            color: #66b2ff;
            text-decoration: none;
        }

        .result-link:hover {
            text-decoration: underline;
        }

        .copy-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mode-content {
            display: none;
            transition: opacity 0.3s ease;
        }

        .mode-content.active {
            display: block;
        }

        @media (max-width: 600px) {
            .option-group label {
                width: 100%;
            }

            .time-display {
                top: 8%;
                font-size: 40px;
            }

            .footer-text {
                font-size: 13px;
            }

            .container {
                padding: 2.5%;
                margin: 1.25%;
                max-height: 80vh;
                overflow-y: auto;
            }

            .clearfix, .button-group {
                flex-direction: column;
                width: 100%;
            }

            input[type="text"], textarea {
                width: 100%;
                margin-bottom: 10px;
            }

            #openButton, #batchProcessButton, #copyAllButton {
                width: 100%;
            }
        }

        @media (max-width: 400px) {
            .option-group label {
                width: 100%;
            }

            .time-display {
                top: 6%;
                font-size: 30px;
            }

            .footer-text {
                font-size: 10px;
            }

            .container {
                padding: 1.875%;
                margin: 1%;
                max-height: 85vh;
                overflow-y: auto;
            }
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 15px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }

        /* 新增：手机端隐藏时间和底部更新说明 */
        @media (max-width: 768px) {
            .time-display, .footer-text {
                display: none !important;
            }
        }
    </style>
</head>

            },
            {
                id: 'customBase64',
                name: 'Base64解码(剪贴板)',
                category: 'specialized',
                convert: (url) => {
                    try {
                        const urlObj = new URL(url);
                        const params = new URLSearchParams(urlObj.search);
                        const cpoParam = params.get('__cpo');

                            throw new Error('URL中缺少__cpo参数');
                        }
                        
                        const paddedCpo = cpoParam.replace(/-/g, '+').replace(/_/g, '/')
                            .padEnd(cpoParam.length + (4 - cpoParam.length % 4) % 4, '=');
                        const decodedDomain = atob(paddedCpo);
                        
                        params.delete('__cpo');
                        const newQuery = params.toString() ? `?${params.toString()}` : '';
                        return `${decodedDomain}${urlObj.pathname}${newQuery}`;

        // 分类名称映射
        const categoryNames = {
            'direct': '缓存节点',
            'proxy': '代理节点',
            'specialized': '专用节点',
            'videos': '视频节点',
            'tools': '工具节点'
        };

        // 状态管理
        let selectedServiceId = '';
        let activeCategory = 'all';
        let batchResults = []; // 存储批量处理结果
        let originalTimeFontSize = 65; // 原始时间字体大小
        let originalTimeTop = '10%'; // 原始时间位置
        let minTimeFontSize = 30; // 最小时间字体大小
        let maxTimeFontSize = 120; // 最大时间字体大小

        // DOM 元素
        const serviceOptionsContainer = document.getElementById('serviceOptions');
        const categoryTabsContainer = document.getElementById('categoryTabs');
        const urlInput = document.getElementById('urlInput');
        const batchUrlInput = document.getElementById('batchUrlInput');
        const batchResultsContainer = document.getElementById('batchResults');
        const resultsContainer = document.getElementById('resultsContainer');
        const copyAllButton = document.getElementById('copyAllButton');
        const copyNotification = document.getElementById('copyNotification');
        const timeDisplay = document.getElementById('timeDisplay');
        const mainContainer = document.getElementById('mainContainer');

        // 初始化函数
        function init() {
            renderCategoryTabs();
            renderServiceOptions();
            initTimeDisplay();
            initModeTabs();
            
            // 存储原始时间样式
            originalTimeFontSize = parseInt(window.getComputedStyle(timeDisplay).fontSize);
            originalTimeTop = window.getComputedStyle(timeDisplay).top;
            
            // 监听窗口大小变化，调整时间显示
            window.addEventListener('resize', adjustTimeDisplay);
            
            // 初始调整一次
            setTimeout(adjustTimeDisplay, 100);
        }

        // 初始化模式切换标签
        function initModeTabs() {
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const mode = this.getAttribute('data-mode');
                    
                    // 更新标签样式
                    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 显示对应模式内容，隐藏其他模式
                    document.querySelectorAll('.mode-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    
                    document.getElementById(`${mode}Mode`).classList.add('active');
                    
                    // 模式切换后调整时间显示
                    setTimeout(adjustTimeDisplay, 100); // 稍等一下让布局完成
                });
            });
        }

        // 根据容器高度和窗口高度调整时间显示
        function adjustTimeDisplay() {
            const containerHeight = mainContainer.offsetHeight;
            const windowHeight = window.innerHeight;
            
            // 计算可用空间 - 窗口高度减去容器高度和页脚高度
            const footerHeight = document.querySelector('.footer-text').offsetHeight;
            const availableSpace = windowHeight - containerHeight - footerHeight - 40; // 40是边距
            
            // 批量模式额外调整因子
            const isBatchMode = document.getElementById('batchMode').classList.contains('active');
            const batchFactor = isBatchMode ? 0.8 : 1;
            
            // 计算基础字体大小：可用空间越大，字体越大；可用空间越小，字体越小
            // 使用对数函数让变化更自然，避免极端值
            let baseFontSize = Math.log(Math.max(availableSpace, 50)) * 15 * batchFactor;
            
            // 限制在最小和最大字体大小之间
            baseFontSize = Math.max(minTimeFontSize, Math.min(maxTimeFontSize, baseFontSize));
            
            // 计算位置：字体越大，位置越靠下；字体越小，位置越靠上
            const topPercentage = 8 + (baseFontSize / maxTimeFontSize) * 0.1; // 8%到8.1%之间
            
            // 应用新样式
            timeDisplay.style.fontSize = `${baseFontSize}px`;
            timeDisplay.style.top = `${topPercentage}%`;
        }

        // 获取所有唯一的分类
        function getUniqueCategories() {
            const categories = new Set();
            services.forEach(service => categories.add(service.category));
            return Array.from(categories);
        }

        // 渲染分类标签
        function renderCategoryTabs() {
            // 添加"全部"选项
            const allTab = document.createElement('div');
            allTab.className = 'category-tab active';
            allTab.textContent = '全部';
            allTab.onclick = () => switchCategory('all');
            categoryTabsContainer.appendChild(allTab);

            // 添加各个分类
            const categories = getUniqueCategories();
            categories.forEach(category => {
                const tab = document.createElement('div');
                tab.className = 'category-tab';
                tab.textContent = categoryNames[category] || category;
                tab.onclick = () => switchCategory(category);
                categoryTabsContainer.appendChild(tab);
            });
        }

        // 切换分类
        function switchCategory(category) {
            activeCategory = category;
            
            // 更新标签样式
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.category-tab').forEach(tab => {
                if ((category === 'all' && tab.textContent === '全部') || 
                    (category !== 'all' && tab.textContent === (categoryNames[category] || category))) {
                    tab.classList.add('active');
                }
            });
            
            // 重新渲染服务选项
            renderServiceOptions();
            
            // 分类切换后可能改变容器高度，调整时间显示
            setTimeout(adjustTimeDisplay, 100);
        }

        // 按分类分组服务
        function groupServicesByCategory() {
            const groups = {};
            
            // 初始化所有分类组
            getUniqueCategories().forEach(category => {
                groups[category] = [];
            });
            
            // 将服务分配到相应的组
            services.forEach(service => {
                if (!groups[service.category]) {
                    groups[service.category] = [];
                }
                groups[service.category].push(service);
            });
            
            return groups;
        }

        // 渲染服务选项
        function renderServiceOptions() {
            serviceOptionsContainer.innerHTML = '';
            const serviceGroups = groupServicesByCategory();
            
            // 确定要显示的分类
            const categoriesToShow = activeCategory === 'all' 
                ? getUniqueCategories() 
                : [activeCategory];
            
            // 为每个分类创建服务组
            categoriesToShow.forEach(category => {
                const servicesInCategory = serviceGroups[category];
                if (servicesInCategory.length === 0) return;
                
                // 创建服务组容器
                const groupContainer = document.createElement('div');
                groupContainer.className = 'service-group';
                
                // 添加分类标题
                const groupTitle = document.createElement('h3');
                groupTitle.textContent = categoryNames[category] || category;
                groupContainer.appendChild(groupTitle);
                
                // 添加服务选项
                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'option-group';
                
                servicesInCategory.forEach(service => {
                    const label = document.createElement('label');
                    label.innerHTML = `
                        <input type="radio" name="service" value="${service.id}" 
                               onclick="selectService('${service.id}')" 
                               ${selectedServiceId === service.id ? 'checked' : ''}>${service.name}
                    `;
                    optionsContainer.appendChild(label);
                });
                
                groupContainer.appendChild(optionsContainer);
                serviceOptionsContainer.appendChild(groupContainer);
            });
        }

        // 选择服务
        function selectService(serviceId) {
            selectedServiceId = serviceId;
        }

        // 显示复制提示
        function showCopyNotification(message) {
            copyNotification.textContent = message;
            copyNotification.style.opacity = '1';
            
            setTimeout(() => {
                copyNotification.style.opacity = '0';
            }, 2000);
        }

        // 打开转换后的页面
        function openConvertedPage() {
            const url = urlInput.value.trim();
            if (!url || !selectedServiceId) {
                alert('请输入链接并选择服务');
                return;
            }

            processSingleUrl(url);
        }

        // 处理单个URL
        function processSingleUrl(url) {
            // 找到选中的服务配置
            const service = services.find(s => s.id === selectedServiceId);
            if (!service) {
                alert('所选服务不存在');
                return;
            }

            try {
                // 调用服务的转换函数
                const convertedUrl = service.convert(url);
                
                // 根据服务配置执行相应操作
                if (service.action === 'copy') {
                    navigator.clipboard.writeText(convertedUrl)
                        .then(() => {
                            showCopyNotification('已复制到剪贴板!');
                        })
                        .catch(err => {
                            console.error('复制失败:', err);
                            alert('复制失败，请手动复制: ' + convertedUrl);
                        });
                } else {
                    window.open(convertedUrl, '_blank');
                }
            } catch (error) {
                alert(`处理失败: ${error.message}`);
            }
        }

        // 批量处理URLs
        function processBatchUrls() {
            const urlsText = batchUrlInput.value.trim();
            if (!urlsText || !selectedServiceId) {
                alert('请输入链接（每行一个）并选择服务');
                return;
            }

            // 按行分割URLs，过滤空行
            const urls = urlsText.split('\n')
                .map(url => url.trim())
                .filter(url => url.length > 0);

            if (urls.length === 0) {
                alert('请输入有效的链接');
                return;
            }

            // 找到选中的服务配置
            const service = services.find(s => s.id === selectedServiceId);
            if (!service) {
                alert('所选服务不存在');
                return;
            }

            // 处理所有URL
            batchResults = [];
            resultsContainer.innerHTML = '';
            
            urls.forEach((url, index) => {
                try {
                    const convertedUrl = service.convert(url);
                    batchResults.push({
                        original: url,
                        converted: convertedUrl,
                        success: true
                    });
                    
                    // 添加到结果显示
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.innerHTML = `
                        <div class="result-original">原始: ${url}</div>
                        <div class="result-converted">
                            转换: <a href="${convertedUrl}" class="result-link" target="_blank">${convertedUrl}</a>
                            ${service.action !== 'copy' ? 
                                `<button onclick="window.open('${convertedUrl}', '_blank')" style="margin-left:8px;padding:2px 8px;font-size:12px;">打开</button>` : 
                                `<button onclick="copyToClipboard('${convertedUrl.replace(/'/g, "\\'")}')" style="margin-left:8px;padding:2px 8px;font-size:12px;">复制</button>`
                            }
                        </div>
                    `;
                    resultsContainer.appendChild(resultItem);
                    
                } catch (error) {
                    batchResults.push({
                        original: url,
                        error: error.message,
                        success: false
                    });
                    
                    // 添加错误结果
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.innerHTML = `
                        <div class="result-original">原始: ${url}</div>
                        <div class="result-converted" style="color:#ff6b6b;">
                            错误: ${error.message}
                        </div>
                    `;
                    resultsContainer.appendChild(resultItem);
                }
            });

            // 显示结果区域和复制全部按钮
            batchResultsContainer.classList.add('active');
            copyAllButton.style.display = 'block';
            
            // 结果显示后容器高度变化，调整时间显示
            setTimeout(adjustTimeDisplay, 100);
        }

        // 复制单个结果到剪贴板
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text)
                .then(() => {
                    showCopyNotification('已复制到剪贴板!');
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制');
                });
        }

        // 复制所有结果到剪贴板
        function copyAllResults() {
            if (batchResults.length === 0) return;
            
            // 构建所有转换后的URL文本，每行一个
            const allConvertedUrls = batchResults
                .filter(item => item.success)
                .map(item => item.converted)
                .join('\n');
            
            if (allConvertedUrls.length === 0) {
                alert('没有可复制的成功结果');
                return;
            }
            
            navigator.clipboard.writeText(allConvertedUrls)
                .then(() => {
                    showCopyNotification(`已复制 ${batchResults.filter(item => item.success).length} 个链接到剪贴板!`);
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制');
                });
        }

        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                openConvertedPage();
            }
        }

        // 时间显示相关
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
        }

        function initTimeDisplay() {
            setInterval(updateTime, 1000);
            updateTime(); // 初始化时间显示
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
